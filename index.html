<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FREE AI Automation Starter Kit | OmniChat AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* RESET */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #0a0f1e;
      overflow: hidden;
      position: relative;
    }

    /* ANIMATED NEON BACKGROUND */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 20% 50%, rgba(43, 108, 158, 0.15), transparent 60%),
        radial-gradient(ellipse at 80% 50%, rgba(124, 58, 237, 0.15), transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(6, 182, 212, 0.08), transparent 50%);
      animation: bgPulse 8s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0% { opacity: 0.6; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    /* FLOATING NEON ORBS */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: orbFloat 12s infinite ease-in-out;
    }
    .orb:nth-child(1) { width: 300px; height: 300px; background: #2b6c9e; top: -100px; left: -100px; animation-delay: 0s; }
    .orb:nth-child(2) { width: 400px; height: 400px; background: #7c3aed; bottom: -150px; right: -150px; animation-delay: -4s; }
    .orb:nth-child(3) { width: 200px; height: 200px; background: #06b6d4; top: 60%; left: 10%; animation-delay: -8s; }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(40px, -60px) scale(1.2); }
      50% { transform: translate(-30px, 30px) scale(0.8); }
      75% { transform: translate(50px, 40px) scale(1.1); }
    }

    /* MAIN CARD - GLASSMORPHISM + NEON BORDER */
    .card {
      position: relative;
      z-index: 1;
      max-width: 540px;
      width: 100%;
      background: rgba(10, 15, 30, 0.65);
      backdrop-filter: blur(30px) saturate(1.4);
      -webkit-backdrop-filter: blur(30px) saturate(1.4);
      border-radius: 40px;
      padding: 50px 42px;
      border: 1px solid rgba(43, 108, 158, 0.25);
      box-shadow: 
        0 30px 80px rgba(0,0,0,0.7),
        0 0 40px rgba(43, 108, 158, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.05);
      animation: cardGlow 4s ease-in-out infinite alternate;
      transform: translateY(0);
      transition: all 0.4s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(43, 108, 158, 0.5);
      box-shadow: 0 40px 100px rgba(0,0,0,0.8), 0 0 60px rgba(43, 108, 158, 0.12);
    }

    @keyframes cardGlow {
      0% { box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 40px rgba(43, 108, 158, 0.08); }
      100% { box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(43, 108, 158, 0.2); }
    }

    /* BADGE */
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: #0a0f1e;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 6px 18px;
      border-radius: 40px;
      margin-bottom: 18px;
      animation: badgePulse 2s infinite;
    }

    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
    }

    /* ICON */
    .icon-wrapper {
      font-size: 52px;
      margin-bottom: 8px;
      display: inline-block;
      animation: iconFloat 3s infinite ease-in-out;
      filter: drop-shadow(0 0 20px rgba(43, 108, 158, 0.3));
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-10px) scale(1.05); }
    }

    /* TYPOGRAPHY */
    h1 {
      font-size: 34px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #94b8e8 50%, #7c3aed 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-weight: 500;
      font-size: 15px;
      margin-bottom: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .description {
      color: rgba(255,255,255,0.7);
      font-size: 15px;
      line-height: 1.8;
      margin-bottom: 32px;
    }

    /* FORM */
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      text-align: left;
    }

    label {
      display: block;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      font-size: 15px;
      background: rgba(255,255,255,0.04);
      color: #fff;
      transition: all 0.35s ease;
      backdrop-filter: blur(4px);
    }

    input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    input:focus {
      outline: none;
      border-color: #2b6c9e;
      background: rgba(43, 108, 158, 0.08);
      box-shadow: 0 0 0 4px rgba(43, 108, 158, 0.12), inset 0 0 20px rgba(43, 108, 158, 0.05);
      transform: translateY(-2px);
    }

    /* SUBMIT BUTTON - NEON */
    .submit-btn {
      background: linear-gradient(135deg, #2b6c9e, #1a4a7a);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 6px;
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 30px rgba(43, 108, 158, 0.3);
    }

    .submit-btn:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: 0 12px 40px rgba(43, 108, 158, 0.5);
    }

    .submit-btn:active { transform: scale(0.97); }

    .submit-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.5s ease;
      transform: scale(0.5);
    }

    .submit-btn:hover::after {
      opacity: 1;
      transform: scale(1);
    }

    /* SPINNER */
    .spinner {
      display: none;
      margin: 18px auto 0;
      border: 3px solid rgba(255,255,255,0.06);
      border-top: 3px solid #2b6c9e;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* MESSAGES */
    .error, .success {
      padding: 14px 18px;
      border-radius: 14px;
      margin-top: 14px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      animation: fadeSlide 0.4s ease;
      backdrop-filter: blur(4px);
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .error {
      color: #fca5a5;
      background: rgba(220, 38, 38, 0.15);
      border-left: 3px solid #dc2626;
    }

    .success {
      color: #86efac;
      background: rgba(34, 197, 94, 0.12);
      border-left: 3px solid #22c55e;
    }

    /* FOOTER */
    .footer {
      margin-top: 28px;
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.04);
      padding-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .footer-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .footer-links a {
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 13px;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .footer-links a:hover {
      color: #94b8e8;
      background: rgba(43, 108, 158, 0.08);
      border-color: rgba(43, 108, 158, 0.15);
      transform: translateY(-1px);
    }

    .footer-links a i {
      font-style: normal;
    }

    .footer-links .fb-link {
      color: #1877f2;
      border-color: rgba(24, 119, 242, 0.15);
      background: rgba(24, 119, 242, 0.05);
    }

    .footer-links .fb-link:hover {
      background: rgba(24, 119, 242, 0.12);
      border-color: rgba(24, 119, 242, 0.3);
      box-shadow: 0 0 20px rgba(24, 119, 242, 0.08);
    }

    /* RESPONSIVE */
    @media (max-width: 500px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 26px; }
      .icon-wrapper { font-size: 40px; }
      .submit-btn { font-size: 16px; padding: 15px; }
      .footer-links { flex-direction: column; align-items: center; gap: 8px; }
    }
  </style>
</head>
<body>

<!-- BACKGROUND EFFECTS -->
<div class="bg-particles"></div>
<div class="orb"></div>
<div class="orb"></div>
<div class="orb"></div>

<!-- MAIN CARD -->
<div class="card">
  <div class="badge">🚀 FREE DOWNLOAD</div>
  <div class="icon-wrapper">📘</div>
  <h1>AI Automation Starter Kit</h1>
  <div class="subtitle">✨ Futuristic Digital Product</div>
  <p class="description">
    Ilagay ang iyong pangalan at email para ma-download ang iyong libreng guide.
  </p>

  <form id="optinForm">
    <div class="form-group">
      <label for="full_name">👤 Pangalan</label>
      <input type="text" id="full_name" placeholder="Hal. Juan Dela Cruz" required />
    </div>
    <div class="form-group">
      <label for="email">📧 Email Address</label>
      <input type="email" id="email" placeholder="juan@email.com" required />
    </div>
    <button type="submit" class="submit-btn">📥 Kunin ang FREE Kit</button>
  </form>

  <div id="spinner" class="spinner"></div>
  <div id="errorMsg" class="error"></div>
  <div id="successMsg" class="success">✅ Salamat! Ikaw ay na-redirect sa iyong download.</div>

  <div class="footer">
    <div class="footer-links">
      <a href="https://www.facebook.com/OmniChatAISolutionsPH" target="_blank" class="fb-link">
        <i>📘</i> OmniChat AI on Facebook
      </a>
      <a href="mailto:nortebernard21@gmail.com"><i>✉️</i> Email</a>
      <a href="tel:09916792649"><i>📞</i> Call</a>
    </div>
    <span>🔒 Hindi namin ibebenta ang iyong data.</span>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://cnbrgxizrssqaewxswfw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_qK9tJuQ4MU2uzHReXHTxlw_XsOilfbW";
  const PDF_DOWNLOAD_URL = "https://drive.google.com/file/d/1cNdeB4copF4pMD_l1sWlB8V5BoUeGUT-/view?usp=sharing";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const form = document.getElementById('optinForm');
  const errorDiv = document.getElementById('errorMsg');
  const successDiv = document.getElementById('successMsg');
  const spinner = document.getElementById('spinner');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    spinner.style.display = 'block';

    const full_name = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();

    if (!full_name || !email) {
      errorDiv.textContent = 'Pakilagay ang iyong pangalan at email.';
      errorDiv.style.display = 'block';
      spinner.style.display = 'none';
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('leads')
        .insert([{ full_name, email, lead_source: 'website_optin' }]);

      spinner.style.display = 'none';
      if (error) throw error;
      successDiv.style.display = 'block';
      form.reset();
      setTimeout(() => window.location.href = PDF_DOWNLOAD_URL, 1500);
    } catch (err) {
      spinner.style.display = 'none';
      errorDiv.textContent = 'May problema. Pakisubukan ulit.';
      errorDiv.style.display = 'block';
      console.error(err);
    }
  });
</script>
</body>
</html>
