<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FREE AI Automation Starter Kit | OmniChat AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3a5f, #2b6c9e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      max-width: 500px;
      width: 100%;
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { font-size: 28px; color: #0b2b44; margin-bottom: 8px; }
    .sub { color: #2b6c9e; font-weight: 600; margin-bottom: 24px; }
    p { color: #333; margin-bottom: 24px; line-height: 1.6; }
    form { display: flex; flex-direction: column; gap: 16px; text-align: left; }
    label { font-weight: 600; color: #1e3a5f; font-size: 14px; }
    input {
      padding: 12px 16px;
      border: 2px solid #dce3ed;
      border-radius: 12px;
      font-size: 16px;
      transition: 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #2b6c9e;
      box-shadow: 0 0 0 3px rgba(43, 108, 158, 0.2);
    }
    button {
      background: #2b6c9e;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }
    button:hover { background: #1e4f79; transform: scale(1.01); }
    .footer { margin-top: 20px; font-size: 13px; color: #6b7a8a; }
    .error { color: #b22234; background: #ffe6e6; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
    .success { color: #0a5e2a; background: #e0f7e6; padding: 10px; border-radius: 8px; margin-top: 10px; display: none; }
    .spinner { display: none; margin: 12px auto; border: 4px solid #f3f3f3; border-top: 4px solid #2b6c9e; border-radius: 50%; width: 30px; height: 30px; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <h1>📘 AI Automation Starter Kit</h1>
  <div class="sub">FREE Digital Product</div>
  <p>Ilagay ang iyong pangalan at email para ma-download ang iyong libreng guide.</p>

  <form id="optinForm">
    <label for="name">Pangalan</label>
    <input type="text" id="name" placeholder="Hal. Juan Dela Cruz" required />

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="juan@email.com" required />

    <button type="submit">📥 Kunin ang FREE Kit</button>
  </form>

  <div id="spinner" class="spinner"></div>
  <div id="errorMsg" class="error"></div>
  <div id="successMsg" class="success">✅ Salamat! Ikaw ay na-redirect sa iyong download.</div>

  <div class="footer">🔒 Hindi namin ibebenta ang iyong data. Magagamit ito para sa aming consultation offer.</div>
</div>

<script>
  const SUPABASE_URL = "https://cnbrgxizrssqaewxswfw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_qK9tJuQ4MU2uzHReXHTxlw_XsOilfbW";
  const PDF_DOWNLOAD_URL = "https://drive.google.com/file/d/1cNdeB4copF4pMD_l1sWlB8V5BoUeGUT-/view?usp=sharing";

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const form = document.getElementById('optinForm');
  const errorDiv = document.getElementById('errorMsg');
  const successDiv = document.getElementById('successMsg');
  const spinner = document.getElementById('spinner');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    spinner.style.display = 'block';

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();

    if (!name || !email) {
      errorDiv.textContent = 'Pakilagay ang iyong pangalan at email.';
      errorDiv.style.display = 'block';
      spinner.style.display = 'none';
      return;
    }

    try {
      const { data, error } = await supabaseClient
        .from('leads')
        .insert([{ name, email, lead_source: 'website_optin' }]);

      spinner.style.display = 'none';

      if (error) {
        console.error('Supabase insert error:', error);
        errorDiv.textContent = 'May problema sa pag-save. Pakisubukan ulit.';
        errorDiv.style.display = 'block';
        return;
      }

      successDiv.style.display = 'block';
      form.reset();

      setTimeout(() => {
        window.location.href = PDF_DOWNLOAD_URL;
      }, 1500);

    } catch (err) {
      spinner.style.display = 'none';
      errorDiv.textContent = 'May technical issue. Pakisubukan ulit mamaya.';
      errorDiv.style.display = 'block';
      console.error('Error:', err);
    }
  });
</script>

</body>
</html>
