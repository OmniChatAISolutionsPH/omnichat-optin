<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FREE AI Automation Starter Kit | OmniChat AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* RESET & BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0b1120 0%, #1a2a4a 50%, #2b4a7a 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* ANIMATED BACKGROUND PARTICLES */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 40% 70%, rgba(255,255,255,0.2), transparent),
        radial-gradient(2px 2px at 60% 20%, rgba(255,255,255,0.3), transparent),
        radial-gradient(2px 2px at 80% 80%, rgba(255,255,255,0.2), transparent),
        radial-gradient(1px 1px at 10% 90%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 90% 10%, rgba(255,255,255,0.4), transparent);
      background-size: 200px 200px;
      animation: twinkle 4s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 0.8; }
    }

    /* FLOATING SHAPES */
    .floating-shapes {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      animation: floatShape 20s infinite ease-in-out;
    }

    .shape:nth-child(1) {
      width: 300px;
      height: 300px;
      background: #4a8fe0;
      top: -50px;
      left: -100px;
      animation-delay: 0s;
    }

    .shape:nth-child(2) {
      width: 400px;
      height: 400px;
      background: #7c3aed;
      bottom: -100px;
      right: -100px;
      animation-delay: -5s;
    }

    .shape:nth-child(3) {
      width: 200px;
      height: 200px;
      background: #06b6d4;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
    }

    @keyframes floatShape {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(30px, -40px) scale(1.1); }
      50% { transform: translate(-20px, 20px) scale(0.9); }
      75% { transform: translate(40px, 30px) scale(1.05); }
    }

    /* MAIN CARD */
    .card {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 48px 40px;
      box-shadow: 
        0 30px 80px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.1);
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform: translateY(30px);
      opacity: 0;
    }

    @keyframes slideUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* BADGE */
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #f97316);
      color: white;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 40px;
      margin-bottom: 16px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* HEADER */
    .icon-wrapper {
      font-size: 48px;
      margin-bottom: 8px;
      display: inline-block;
      animation: bounceIcon 3s infinite;
    }

    @keyframes bounceIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      color: #0b1a33;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #0b1a33, #1a3a6a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #2b6c9e;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
    }

    .description {
      color: #4a5a72;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    /* FORM */
    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: left;
    }

    .form-group {
      position: relative;
    }

    label {
      display: block;
      font-weight: 600;
      color: #1a2a4a;
      font-size: 13px;
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-size: 15px;
      transition: all 0.3s ease;
      background: white;
      color: #1a2a4a;
    }

    input:focus {
      outline: none;
      border-color: #2b6c9e;
      box-shadow: 0 0 0 4px rgba(43, 108, 158, 0.12);
      transform: translateY(-1px);
    }

    input::placeholder {
      color: #a0b0c8;
    }

    /* SUBMIT BUTTON */
    .submit-btn {
      background: linear-gradient(135deg, #2b6c9e, #1a4a7a);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 40px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.5px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(43, 108, 158, 0.4);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
      transform: scale(0.5);
    }

    .submit-btn:hover::after {
      opacity: 1;
      transform: scale(1);
    }

    /* SPINNER */
    .spinner {
      display: none;
      margin: 16px auto 0;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2b6c9e;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* MESSAGES */
    .error, .success {
      padding: 12px 18px;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 14px;
      font-weight: 500;
      display: none;
      animation: fadeSlide 0.4s ease;
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .error {
      color: #b22234;
      background: #ffe6e6;
      border-left: 4px solid #b22234;
    }

    .success {
      color: #0a5e2a;
      background: #e0f7e6;
      border-left: 4px solid #0a5e2a;
    }

    /* FOOTER */
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #8a9ab0;
      text-align: center;
      border-top: 1px solid #e8edf5;
      padding-top: 20px;
      letter-spacing: 0.2px;
    }

    .footer span {
      display: inline-block;
      margin: 0 8px;
    }

    /* RESPONSIVE */
    @media (max-width: 480px) {
      .card {
        padding: 32px 20px;
      }
      h1 {
        font-size: 26px;
      }
      .icon-wrapper {
        font-size: 36px;
      }
      .submit-btn {
        font-size: 16px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>

<!-- FLOATING SHAPES -->
<div class="floating-shapes">
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
</div>

<!-- MAIN CARD -->
<div class="card">
  <div class="badge">🎁 FREE DOWNLOAD</div>

  <div class="icon-wrapper">📘</div>
  <h1>AI Automation Starter Kit</h1>
  <div class="subtitle">✨ FREE Digital Product</div>

  <p class="description">
    Ilagay ang iyong pangalan at email para ma-download ang iyong libreng guide.
  </p>

  <form id="optinForm">
    <div class="form-group">
      <label for="full_name">📝 Pangalan</label>
      <input type="text" id="full_name" placeholder="Hal. Juan Dela Cruz" required />
    </div>

    <div class="form-group">
      <label for="email">📧 Email Address</label>
      <input type="email" id="email" placeholder="juan@email.com" required />
    </div>

    <button type="submit" class="submit-btn">📥 Kunin ang FREE Kit</button>
  </form>

  <div id="spinner" class="spinner"></div>
  <div id="errorMsg" class="error"></div>
  <div id="successMsg" class="success">✅ Salamat! Ikaw ay na-redirect sa iyong download.</div>

  <div class="footer">
    🔒 Hindi namin ibebenta ang iyong data.<br/>
    <span>📧 nortebernard21@gmail.com</span>
    <span>•</span>
    <span>📞 09916792649</span>
  </div>
</div>

<script>
  // Supabase configuration
  const SUPABASE_URL = "https://cnbrgxizrssqaewxswfw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_qK9tJuQ4MU2uzHReXHTxlw_XsOilfbW";
  const PDF_DOWNLOAD_URL = "https://drive.google.com/file/d/1cNdeB4copF4pMD_l1sWlB8V5BoUeGUT-/view?usp=sharing";

  // Create Supabase client
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Get form elements
  const form = document.getElementById('optinForm');
  const errorDiv = document.getElementById('errorMsg');
  const successDiv = document.getElementById('successMsg');
  const spinner = document.getElementById('spinner');

  // Handle form submission
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Hide previous messages, show spinner
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';
    spinner.style.display = 'block';

    // Get form values
    const full_name = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();

    // Validate inputs
    if (!full_name || !email) {
      errorDiv.textContent = 'Pakilagay ang iyong pangalan at email.';
      errorDiv.style.display = 'block';
      spinner.style.display = 'none';
      return;
    }

    try {
      // Save to Supabase
      const { data, error } = await supabaseClient
        .from('leads')
        .insert([{ 
          full_name: full_name, 
          email: email, 
          lead_source: 'website_optin' 
        }]);

      spinner.style.display = 'none';

      // Handle error
      if (error) {
        console.error('Supabase insert error:', error);
        errorDiv.textContent = 'May problema sa pag-save. Pakisubukan ulit.';
        errorDiv.style.display = 'block';
        return;
      }

      // Success - show message and redirect
      successDiv.style.display = 'block';
      form.reset();

      // Redirect to PDF after 1.5 seconds
      setTimeout(() => {
        window.location.href = PDF_DOWNLOAD_URL;
      }, 1500);

    } catch (err) {
      // Handle unexpected errors
      spinner.style.display = 'none';
      errorDiv.textContent = 'May technical issue. Pakisubukan ulit mamaya.';
      errorDiv.style.display = 'block';
      console.error('Error:', err);
    }
  });
</script>

</body>
</html>
